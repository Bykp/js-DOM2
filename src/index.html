<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея картинок</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Моя фотогалерея</h1>
        
        <div id="gallery" class="gallery">
            <!-- Сюди будуть додаватися картинки через JS -->
        </div>

        <div class="controls">
            <button id="btn-load">Завантажити ще 4 картинки</button>
            <button id="btn-clear">Очистити галерею</button>
            <button id="btn-remove-last">Видалити останню</button>
            <button id="btn-reverse">Перевернути галерею</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
